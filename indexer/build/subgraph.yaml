specVersion: 0.0.5
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum/contract
    name: DAORegistry
    network: liteforge
    source:
      address: "0xfF8c3453f5617C0483e3D2f38F70126772D6F247"
      abi: DAORegistry
      startBlock: 67045944
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - DAO
      abis:
        - name: DAORegistry
          file: DAORegistry/DAORegistry.json
        - name: DAOGovernor
          file: DAORegistry/DAOGovernor.json
      eventHandlers:
        - event: DAORegistered(indexed address,indexed address,indexed address)
          handler: handleDAORegistered
      file: DAORegistry/DAORegistry.wasm
  - kind: ethereum/contract
    name: TokenFactory
    network: liteforge
    source:
      address: "0x9b3E75Df9bBBCD2b60645ecb473d838f3eAa5dea"
      abi: TokenFactory
      startBlock: 67045944
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Token
      abis:
        - name: TokenFactory
          file: TokenFactory/TokenFactory.json
      eventHandlers:
        - event: TokenCreated(indexed address,indexed address,string,string,uint256)
          handler: handleTokenCreated
      file: TokenFactory/TokenFactory.wasm
  - kind: ethereum/contract
    name: GovernorFactory
    network: liteforge
    source:
      address: "0xfE6e5f87AA0be25c73BeF342217F2b170C9e38a2"
      abi: GovernorFactory
      startBlock: 67045944
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - DAO
      abis:
        - name: GovernorFactory
          file: GovernorFactory/GovernorFactory.json
      eventHandlers:
        - event: GovernorCreated(indexed address,address,indexed address,indexed address,string)
          handler: handleGovernorCreated
      file: GovernorFactory/GovernorFactory.wasm
  - kind: ethereum/contract
    name: FaucetFactory
    network: liteforge
    source:
      address: "0x01aD919d404Cd4a67F990499753fEBB78d21ED6b"
      abi: FaucetFactory
      startBlock: 67045944
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Faucet
      abis:
        - name: FaucetFactory
          file: FaucetFactory/FaucetFactory.json
      eventHandlers:
        - event: FaucetCreated(indexed address,indexed address,indexed address,uint8)
          handler: handleFaucetCreated
      file: FaucetFactory/FaucetFactory.wasm
  - kind: ethereum/contract
    name: DAOMetadataRegistry
    network: liteforge
    source:
      address: "0x351eE3234E6F0329d8cD88AEd89005899bfeA053"
      abi: DAOMetadataRegistry
      startBlock: 67045944
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - DAO
      abis:
        - name: DAOMetadataRegistry
          file: DAOMetadataRegistry/DAOMetadataRegistry.json
      eventHandlers:
        - event: DAOMetadataUpdated(indexed address,string,string,indexed address)
          handler: handleDAOMetadataUpdated
      file: DAOMetadataRegistry/DAOMetadataRegistry.wasm
templates:
  - kind: ethereum/contract
    name: GovernorTemplate
    network: liteforge
    source:
      abi: DAOGovernor
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - DAO
        - Proposal
        - Vote
      abis:
        - name: DAOGovernor
          file: GovernorTemplate/DAOGovernor.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
        - event: VoteCastWithParams(indexed address,uint256,uint8,uint256,string,bytes)
          handler: handleVoteCastWithParams
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
      file: templates/GovernorTemplate/GovernorTemplate.wasm
  - kind: ethereum/contract
    name: TokenTemplate
    network: liteforge
    source:
      abi: DAOToken
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - DAO
        - TokenHolder
        - Delegate
      abis:
        - name: DAOToken
          file: TokenTemplate/DAOToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: DelegateChanged(indexed address,indexed address,indexed address)
          handler: handleDelegateChanged
        - event: DelegateVotesChanged(indexed address,uint256,uint256)
          handler: handleDelegateVotesChanged
      file: templates/TokenTemplate/TokenTemplate.wasm
  - kind: ethereum/contract
    name: FaucetTemplate
    network: liteforge
    source:
      abi: DAOFaucet
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Faucet
        - FaucetClaim
      abis:
        - name: DAOFaucet
          file: FaucetTemplate/DAOFaucet.json
      eventHandlers:
        - event: Claimed(indexed address,uint256,uint8)
          handler: handleClaimed
      file: templates/FaucetTemplate/FaucetTemplate.wasm
